      :root {

        --ink-soft: #55656e;
        --line: #c3cfd4;
        --key: #ffffff;
        --key-hover: #eef5f7;
        --key-num: #dbe5e9;
        --key-num-hover: #cddae0;
        --key-mark: #cfeae2;
        --key-mark-hover: #bde1d7;
        --key-ctl: #e4dff0;
        --key-ctl-hover: #d6cfe8;
        --key-act: #cdd8dd;
        --key-act-hover: #bfcdd3;
        --accent: #0d6b63;

        color-scheme: light;

          --paper: #12191d;

          --key-ctl: #2d2a45;
          --key-ctl-hover: #38355a;
          --key-act: #34444c;
          --key-act-hover: #415560;
          --accent: #4fc2b4;
          --accent-ink: #0b1d1a;
          --shadow: #090e11;
          color-scheme: dark;

          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.4;
        -webkit-text-size-adjust: 100%;
        overflow: auto;
      }

      /* The page fills the screen; the text box takes whatever the keys leave. */
      .app {
        height: calc(100 * var(--vh));
        min-height: 500px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 16px 14px;
        max-width: 1500px;
        margin: 0 auto;

        /* key height, derived from the screen so that everything fits */
        --kh: clamp(
          40px,
          min(
            86px,
            (100 * var(--vh) - 245px) / 4.3,
            (100vw - 90px) / 17 * 1.15
          ),
          92px
        );
        --kfs: calc(var(--kh) * 0.56);
        --ofs: 64px;
      }

      /* ---------- top bar ---------- */
      .top {
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 40px;
      }
      .top h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .tip {
        margin: 0;
        flex: 1 1 auto;
        min-width: 0;
        color: var(--ink-soft);
        font-size: 13px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .size {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-soft);
        font-size: 12px;
      }
      .size input {
        width: 96px;
        accent-color: var(--accent);
      }
      .size .sm {
        font-family: "TSG Nti", sans-serif;
        font-size: 14px;
        color: var(--ink-soft);
      }
      .size .lg {
        font-family: "TSG Nti", sans-serif;
        font-size: 22px;
        color: var(--ink-soft);
      }

      .btn {
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        background: var(--key);
        border: 1.5px solid var(--line);
        border-radius: 9px;
        padding: 6px 14px;
        min-height: 38px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .btn:hover {
        background: var(--key-hover);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      :is(.btn, .key, #out):focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- text box ---------- */
      .compose {
        flex: 1 1 0;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1.5px solid var(--line);
        border-radius: 14px;
        padding: 8px 8px 6px;
      }
      #out {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        resize: none;
        border: 0;
        border-radius: 9px;
        padding: 4px 12px;
        background: var(--key);
        color: var(--ink);
        font-family: "TSG Nti", sans-serif;
        font-size: var(--ofs);
        line-height: 1.5;
        font-feature-settings:
          "ccmp" 1,
          "liga" 1,
          "mark" 1,
          "mkmk" 1;
        font-kerning: normal;
        caret-color: var(--accent);
      }
      #out::placeholder {
        font-family: "Segoe UI", "SF Pro Text", system-ui, sans-serif;
        font-size: 16px;
        color: var(--ink-soft);
      }
      .readout {
        flex: none;
        padding: 4px 6px 0;
        font-size: 12px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ---------- keyboard ---------- */
      .kb {
        flex: none;
        display: grid;
        grid-template-columns: 9fr 4fr 4fr;
        gap: 16px;
        align-items: start;
      }
      .zone {
        min-width: 0;
      }
      .zone h2 {
        margin: 0 0 5px 2px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
        grid-auto-rows: var(--kh);
        gap: var(--gap);
      }
      .zone[data-z="letters"] .grid {
        --cols: 9;
      }
      .zone[data-z="numbers"] .grid {
        --cols: 4;
      }
      .zone[data-z="marks"] .grid {
        --cols: 4;
      }

      .key {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 1px;
        min-width: 0;
        padding: 3px 2px 5px;
        font: inherit;
        color: var(--ink);
        background: var(--key);
        border: 1.5px solid var(--line);
        border-bottom: 3px solid var(--shadow);
        border-radius: 10px;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      .key:hover {
        background: var(--key-hover);
      }
      .key:active {
        transform: translateY(2px);
        border-bottom-width: 1.5px;
      }
      .key.hit {
        animation: hit 0.18s ease-out;
      }
      @keyframes hit {
        from {
          box-shadow: 0 0 0 4px
            color-mix(in srgb, var(--accent) 45%, transparent);
        }
        to {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      .key.num {
        background: var(--key-num);
      }
      .key.num:hover {
        background: var(--key-num-hover);
      }
      .key.mark {
        background: var(--key-mark);
      }
      .key.mark:hover {
        background: var(--key-mark-hover);
      }
      .key.ctl {
        background: var(--key-ctl);
      }
      .key.ctl:hover {
        background: var(--key-ctl-hover);
      }

      /* marks that join the character just typed */
      .key.mark.fit {
        outline: 3px solid var(--accent);
        outline-offset: -1px;
      }
      .key.mark.nofit {
        opacity: 0.4;
      }

      .key.act {
        justify-content: center;
        background: var(--key-act);
        font-size: 14px;
        font-weight: 600;
        padding-bottom: 3px;
      }
      .key.act:hover {
        background: var(--key-act-hover);
      }

      /* the computer key that types this one */
      .kbhint {
        position: absolute;
        top: 3px;
        left: 6px;
        font-size: 10.5px;
        font-weight: 650;
        line-height: 1;
        color: var(--ink-soft);
        pointer-events: none;
      }
      .app.nohints .kbhint {
        display: none;
      }
      .btn[aria-pressed="true"] {
        background: var(--key-act);
      }

      .glyph {
        position: relative;
        display: block;
        width: 100%;
        height: 1.1em;
        font-family: "TSG Nti", sans-serif;
        font-size: var(--kfs);
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
        font-feature-settings:
          "ccmp" 0,
          "liga" 0;
        pointer-events: none;
      }
      /* A mark has no width of its own, so it is drawn above a dotted circle. */
      .glyph.mark::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0.4em;
        width: 0.46em;
        height: 0.46em;
        transform: translateX(-50%);
        border: 2px dotted var(--ink-soft);
        border-radius: 50%;
        opacity: 0.55;
      }
      .glyph.mark .mk {
        position: absolute;
        left: 50%;
        top: 0;
        width: 0;
        line-height: 1.1;
      }

      .label {
        font-size: 10.5px;
        line-height: 1.15;
        color: var(--ink-soft);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      .kb[data-layout="wide"] .act.space {
        grid-column: span 6;
      }
      .kb[data-layout="wide"] .act.enter {
        grid-column: span 3;
      }
      .kb[data-layout="wide"] .act.back {
        grid-column: span 4;
      }

      /* ---------- narrow screens: stack the three groups ---------- */
      @media (max-width: 879px) {
        .app {
          padding: 8px 10px 10px;
          gap: 8px;
          --kh: clamp(
            38px,
            min(
              76px,
              (100 * var(--vh) - 290px) / 8.4,
              (100vw - 32px) / 9 * 1.25
            ),
            80px
          );
          --ofs: 44px;
        }
        .tip {
          display: none;
        }
        .key.act {
          font-size: 13px;
        }
        .size .sm,
        .size .lg {
          display: none;
        }
        .size input {
          width: 70px;
        }
        .kb {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .zone h2 {
          margin-bottom: 3px;
          font-size: 12px;
        }
        .zone[data-z="letters"] .grid {
          --cols: 9;
        }
        .zone[data-z="numbers"] .grid {
          --cols: 6;
        }
        .zone[data-z="marks"] .grid {
          --cols: 8;
        }
        .key {
          border-radius: 8px;
        }
        .label {
          font-size: 9.5px;
        }
        .readout .cps {
          display: none;
        }
        .kb[data-layout="narrow"] .act.space {
          grid-column: span 5;
        }
        .kb[data-layout="narrow"] .act.enter {
          grid-column: span 2;
        }
        .kb[data-layout="narrow"] .act.back {
          grid-column: span 2;
        }
      }

      @media (max-width: 559px) {
        #hints {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .key.hit {
          animation: none;
        }
        .btn:active,
        .key:active {
          transform: none;
        }
      }
    </style>

            var glyph = document.createElement("span");
            glyph.className = "glyph" + (k.m ? " mark" : "");
            var ch = String.fromCodePoint(k.cp);
            if (k.m) {
              var mk = document.createElement("span");
              mk.className = "mk";
              mk.textContent = ch;
              glyph.appendChild(mk);
              markKeys.push({ cp: k.cp, el: b });
            } else {
              glyph.textContent = ch;
            }
            var lab = document.createElement("span");
            lab.className = "label";
            lab.textContent = k.l;
            byName[k.n] = { cp: k.cp, el: b };
            b.appendChild(glyph);
            b.appendChild(lab);
            grid.appendChild(b);
          });

          zone.appendChild(grid);
          kbd.appendChild(zone);
        });

        function actKey(cls, label, act) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "key act " + cls;
          b.setAttribute("data-act", act);
          b.textContent = label;
          return b;
        }
        var spaceKey = actKey("space", "Space", "space");
        var enterKey = actKey("enter", "New line", "enter");
        var backKey = actKey("back", "Backspace", "back");
        backKey.setAttribute("aria-label", "Backspace");

        /* Wide screens: Backspace sits under the numbers. Narrow: next to Space. */
        var mq = window.matchMedia("(min-width: 880px)");
        function place() {
          grids.letters.appendChild(spaceKey);
          grids.letters.appendChild(enterKey);
          (mq.matches ? grids.numbers : grids.letters).appendChild(backKey);
          kbd.setAttribute("data-layout", mq.matches ? "wide" : "narrow");
        }
        place();
        if (mq.addEventListener) mq.addEventListener("change", place);
        else if (mq.addListener) mq.addListener(place);

        /* ---------- which marks join the character before the cursor ---------- */
        var byMark = {};
        LIG.forEach(function (seq) {
          var last = seq[seq.length - 1];
          (byMark[last] = byMark[last] || []).push(seq.slice(0, -1));
        });

        function tailMatches(ctx, prefix) {
          if (prefix.length > ctx.length) return false;
          for (var i = 0; i < prefix.length; i++) {
            if (ctx[ctx.length - prefix.length + i] !== prefix[i]) return false;
          }
          return true;
        }
        function updateFit() {
          var before = out.value.slice(0, out.selectionStart);
          var ctx = Array.from(before)
            .map(function (c) {
              return c.codePointAt(0);
            })
            .slice(-4);
          markKeys.forEach(function (m) {
            var ok = (byMark[m.cp] || []).some(function (p) {
              return tailMatches(ctx, p);
            });
            m.el.classList.toggle("fit", ok);
            m.el.classList.toggle("nofit", !ok);
          });
        }

        /* ---------- computer keyboard ---------- */
        var LOOKUP = {};
        QWERTY.forEach(function (q) {
          var target = byName[q[3]];
          if (!target) return;
          LOOKUP[(q[1] ? "S" : "") + q[0]] = target;
          var tip = document.createElement("span");
          tip.className = "kbhint";
          tip.setAttribute("aria-hidden", "true");
          tip.textContent = q[2];
          target.el.appendChild(tip);
          target.el.title += "   key: " + q[2];
        });

        document.addEventListener("keydown", function (ev) {
          if (ev.isComposing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
          var tag = ev.target && ev.target.tagName;
          if (tag === "INPUT" || tag === "SELECT") return;
          var hit = LOOKUP[(ev.shiftKey ? "S" : "") + ev.code];
          if (!hit) return;
          ev.preventDefault();
          hit.el.classList.remove("hit");
          void hit.el.offsetWidth;
          hit.el.classList.add("hit");
          put(String.fromCodePoint(hit.cp));
        });

        var hintsBtn = document.getElementById("hints");
        function showHints(on) {
          app.classList.toggle("nohints", !on);
          hintsBtn.setAttribute("aria-pressed", on ? "true" : "false");
        }
        var savedHints = load("nti.hints");
        showHints(
          savedHints === null
            ? !(
                window.matchMedia &&
                window.matchMedia("(pointer: coarse)").matches
              )
            : savedHints === "1",
        );
        hintsBtn.addEventListener("click", function () {
          var on = hintsBtn.getAttribute("aria-pressed") !== "true";
          showHints(on);
          store("nti.hints", on ? "1" : "0");
        });

        /* ---------- editing ---------- */
        function refresh() {
          var chars = Array.from(out.value);
          var n = chars.length;
          var text = n + (n === 1 ? " character" : " characters");
          if (n) {
            var tail = chars
              .slice(-6)
              .map(function (c) {
                return hex(c.codePointAt(0));
              })
              .join(" ");
            text +=
              '  <span class="cps">' + (n > 6 ? "… " : "") + tail + "</span>";
          }
          info.innerHTML = text;
          updateFit();
          store("nti.text", out.value);
        }

        function put(str) {
          out.focus({ preventScroll: true });
          var ok = false;
          try {
            ok = document.execCommand("insertText", false, str);
          } catch (e) {}
          if (!ok)
            out.setRangeText(str, out.selectionStart, out.selectionEnd, "end");
          refresh();
        }

        function backspace() {
          out.focus({ preventScroll: true });
          var s = out.selectionStart,
            e = out.selectionEnd;
          if (s === e) {
            if (s === 0) return;
            var n = 1;
            var lo = out.value.charCodeAt(s - 1);
            if (lo >= 0xdc00 && lo <= 0xdfff && s >= 2) {
              var hi = out.value.charCodeAt(s - 2);
              if (hi >= 0xd800 && hi <= 0xdbff) n = 2;
            }
            out.setSelectionRange(s - n, s);
          }
          var ok = false;
          try {
            ok = document.execCommand("delete");
          } catch (err) {}
          if (!ok)
            out.setRangeText("", out.selectionStart, out.selectionEnd, "end");
          refresh();
        }

        /* A mouse press on a key must not take the cursor out of the text box. */
        document.addEventListener("mousedown", function (ev) {
          if (ev.target.closest && ev.target.closest(".key, .btn"))
            ev.preventDefault();
        });

        kbd.addEventListener("click", function (ev) {
          var key = ev.target.closest(".key");
          if (!key) return;
          key.classList.remove("hit");
          void key.offsetWidth;
          key.classList.add("hit");
          var act = key.getAttribute("data-act");
          if (act === "space") put(" ");
          else if (act === "enter") put("\n");
          else if (act === "back") backspace();
          else
            put(
              String.fromCodePoint(parseInt(key.getAttribute("data-cp"), 10)),
            );
        });

        document.getElementById("clear").addEventListener("click", function () {
          out.focus({ preventScroll: true });
          out.select();
          var ok = false;
          try {
            ok = document.execCommand("delete");
          } catch (e) {}
          if (!ok) out.value = "";
          refresh();
        });

        var copyBtn = document.getElementById("copy");
        var copyTimer = null;
        function flash(msg) {
          copyBtn.textContent = msg;
          clearTimeout(copyTimer);
          copyTimer = setTimeout(function () {
            copyBtn.textContent = "Copy text";
          }, 1600);
        }
        copyBtn.addEventListener("click", function () {
          var text = out.value;
          if (!text) {
            flash("Nothing to copy");
            return;
          }
          function fallback() {
            var s = out.selectionStart,
              e = out.selectionEnd;
            out.focus();
            out.select();
            var ok = false;
            try {
              ok = document.execCommand("copy");
            } catch (err) {}
            out.setSelectionRange(s, e);
            flash(ok ? "Copied" : "Copy failed");
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              flash("Copied");
            }, fallback);
          } else {
            fallback();
          }
        });

        sizeInput.addEventListener("input", function () {
          app.style.setProperty("--ofs", sizeInput.value + "px");
          store("nti.size", sizeInput.value);
        });

        out.addEventListener("input", refresh);
        ["keyup", "click", "select", "focus"].forEach(function (t) {
          out.addEventListener(t, updateFit);
        });

        /* restore the last session */
        var savedText = load("nti.text");
        if (savedText) out.value = savedText;
        var savedSize = load("nti.size");
        if (savedSize && +savedSize >= 24 && +savedSize <= 140) {
          sizeInput.value = savedSize;
          app.style.setProperty("--ofs", savedSize + "px");
        }
        out.setSelectionRange(out.value.length, out.value.length);
        refresh();
        out.focus({ preventScroll: true });
      })();
    </script>
  </body>
</html>
